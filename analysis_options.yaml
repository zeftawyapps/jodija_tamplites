include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**
  errors:
    must_be_immutable: ignore

linter:
  rules:
    file_names: false
    non_constant_identifier_names: false
    constant_identifier_names: false
    camel_case_types: false
